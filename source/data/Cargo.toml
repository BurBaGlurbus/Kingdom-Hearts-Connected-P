[package]
name = "data"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
validation = { path = "../validation" }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "dds"] }
crc32fast = "=1.5.2"
lewton = { version = "=0.10.2", default-features = false }

[lints]
workspace = true

# These CLI adapters contain no unit tests or private test modules. Keep
# compiling them in workspace builds/Clippy without linking empty harnesses.
# Remove test=false for any adapter that gains its own tests.
